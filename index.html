</style></head><body>
<header><div class="top">
<svg class="logo" viewBox="0 0 32 32" fill="none" stroke="#7dd3c0" stroke-width="2.2"><path d="M16 3 4 7v9c0 7 5 11 12 13 7-2 12-6 12-13V7z"/><path d="M10 17c4 0 6-3 6-7 0 4 2 7 6 7M16 16v8"/></svg>
<a data-v="todos">Todos</a><a data-v="emp">Investimentos</a><a data-v="rec" class="rec">Recomendação</a><a data-v="cfg">Ajustes</a><span class="sp"></span><button class="btn" id="upd">Atualizar</button></div>

<div id="st">Carregando dados salvos…</div>
<main id="m"></main>
<script>
const DATA="dados.json";
const K="radar_v1",$=s=>document.querySelector(s);
let S={};try{S=JSON.parse(localStorage.getItem(K)||"null")||{}}catch(e){S={}};
const primeiraVersao=!S._radarV2;
S=Object.assign({token:"",url:"",dy:6,desc:20,anos:3,lucro:30,watch:[],pos:[],vendas:[],cache:{},upd:null},S);
if(primeiraVersao){S.anos=3;S._radarV2=true;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const R=v=>v==null||isNaN(v)?"-":v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const P=v=>v==null||isNaN(v)?"-":v.toLocaleString("pt-BR",{maximumFractionDigits:2})+"%";
const cls=v=>v>=0?"pos":"neg",COL=["#72b5ab","#fadba0","#e0b050","#8fa8e8","#d98fb0","#a6d98f","#c9a2e8","#e89f8f","#8fd9d9","#b0b0b0","#f0e68c"];
let view="emp",sortK="margem",onlyCheap=false,lastErr="",todosPagina=0,todosOrdenar="t",todosOrdem=1,todosCategoria="todos",todosBusca="";

const SEC={"Financial Services":"Financeiro","Utilities":"Energia e saneamento","Basic Materials":"Materiais básicos","Energy":"Petróleo e gás","Consumer Cyclical":"Consumo cíclico","Consumer Defensive":"Consumo defensivo","Industrials":"Indústria","Healthcare":"Saúde","Communication Services":"Telecom","Technology":"Tecnologia","Real Estate":"Imobiliário"},PER=["Financeiro","Energia e saneamento","Telecom"];
let U={};const DV=t=>(U[t]||{}).div||[];
const tipoAtivo=a=>{
 if(a.cat||a.categoria)return String(a.cat||a.categoria).toLowerCase();
 const t=String(a.t||"").toUpperCase(),n=String(a.nome||"").toLowerCase();
 if(/\b(fii|fundo imobiliário|fundo imobiliario)\b/.test(n))return "fii";
 if(/\b(etf|fundo de índice|fundo de indice)\b/.test(n))return "etf";
 if(/\b(bdr|depositary receipt|depositary receipts)\b/.test(n)||/\d{2}$/.test(t)&&/(34|35|39|32|33|31)$/.test(t))return "bdr";
 return "acao";
};
const idx=j=>{const ativos=j.ativos||j.acoes||[];U=Object.fromEntries(ativos.filter(a=>a&&a.t).map(a=>[String(a.t).toUpperCase(),{...a,t:String(a.t).toUpperCase(),cat:tipoAtivo(a)}]))};if(S.uni)idx(S.uni);
async function carregar(forcar=false){
  const TTL_DADOS=6*60*60*1000;
  const cacheValido=S.uni && S.cacheDadosEm && (Date.now()-S.cacheDadosEm<TTL_DADOS);
  if(!forcar && cacheValido){idx(S.uni);return {origem:"cache"}}
  // Resolve dados.json a partir da pasta publicada no GitHub Pages.
  const endereco=(S.url||new URL(DATA,location.href).href);
  const url=forcar ? endereco+(endereco.includes("?")?"&":"?")+"v="+Date.now() : endereco;
  const r=await fetch(url,{cache:forcar?"no-store":"default"});
  if(!r.ok)throw new Error("Não foi possível ler dados.json (HTTP "+r.status+"). Confira o arquivo publicado.");
  const j=await r.json();
  if(!j || !Array.isArray(j.acoes))throw new Error("Formato inválido em dados.json: a lista 'acoes' não foi encontrada.");
  idx(j);S.uni=j;S.cacheDadosEm=Date.now();save();
  return {origem:"rede"}
}
async function fetchOne(t){const r=await fetch(`https://brapi.dev/api/quote/${t}?token=${S.token}`);const j=await r.json().catch(()=>({})),x=j.results&&j.results[0];if(!x)throw new Error(j.message||("resposta "+r.status));return{p:x.regularMarketPrice,ch:x.regularMarketChangePercent}}
async function atualizar(forcar=true){
 const st=$("#st"),btn=$("#upd");
 if(btn.disabled)return;
 btn.disabled=true;lastErr="";
 st.className="";
 st.innerHTML=forcar
   ? 'Atualizando os dados publicados… <span class="n">Isso apenas relê dados.json; para gerar uma nova coleta, use <a href="https://github.com/hosnaitrix10-crypto/Radarnew/actions/workflows/atualizar-dados.yml" target="_blank" rel="noopener">Executar coleta no GitHub Actions</a>.</span>'
   : 'Carregando dados publicados…';
 try{await carregar(forcar)}catch(e){lastErr=e.message}
 let n=0;
 // A brapi é consultada apenas para as ações da carteira e somente quando o usuário pede atualização.
 if(forcar && S.token)for(const q of S.pos){try{S.cache[q.t]=await fetchOne(q.t);n++}catch(e){}}
 if(S.uni){
   const gerado=S.uni.gerado?new Date(S.uni.gerado):null;
   const dataTxt=gerado&&!isNaN(gerado)?gerado.toLocaleString("pt-BR"):"data sem horário";
   const cacheTxt=S.cacheDadosEm?` · cache local ${Math.max(0,Math.round((Date.now()-S.cacheDadosEm)/60000))} min`:"";
   st.className=lastErr?"off":"";
   st.innerHTML=`Dados publicados de ${dataTxt} · ${Object.keys(U).length} ativos${n?` · ${n} cotações ao vivo`:""}${cacheTxt}${lastErr?" · falha ao atualizar: "+lastErr:""} · <a href="https://github.com/hosnaitrix10-crypto/Radarnew/actions/workflows/atualizar-dados.yml" target="_blank" rel="noopener">Gerar nova coleta no GitHub</a>`;
   if(!lastErr){S.upd=Date.now();save()}
 }else offline();
 btn.disabled=false;draw()}
function offline(){const st=$("#st");st.className="off";st.textContent=lastErr||"Sem dados. Configure o endereço do dados.json em Ajustes."}
function calc(t){const u=U[t];if(!u)return null;const c=S.cache[t]||{},p=c.p||u.p;if(!p)return null;const g=k=>u[k]||0;
 const dpa=g("dpa"),baz=dpa>0?dpa/(S.dy/100):null,lpa=u.pl>0?u.p/u.pl:0,vpa=u.pvp>0?u.p/u.pvp:0,gra=lpa>0&&vpa>0?Math.sqrt(22.5*lpa*vpa):null;
 const teto=Math.min(baz||Infinity,gra||Infinity),ideal=teto*(1-S.desc/100),ms=(teto/p-1)*100,setor=SEC[u.setor]||"Outros";
 const sc=Math.round(Math.min(g("dy")/8,1)*20+Math.min(g("ap"),5)*2+(PER.includes(setor)?10:0)+Math.min(Math.max(g("roe"),0)/20,1)*15+Math.min(Math.max(g("ml"),0)/15,1)*8+(u.dbp==null?0:u.dbp<=1?7:u.dbp<=2?3:0)+(g("cr")>0?5:0)+Math.min(Math.max(ms,0)/40,1)*25);
 const insuf=!(dpa>0)||g("ap")<S.anos||u.dados_yahoo==="indisponivel";
 return{t,nome:u.nome,setor,u,p,ch:c.ch,dpa,teto,ideal,min:(u.lo??u.min_52s??u.min52??u.low52??null),dym:g("dy"),margem:ms,sc,insuf,s:insuf?"i":p<=ideal?"c":p<=teto?"a":"v"}}
const TX={c:"Comprar",a:"Aguardar",v:"Caro",i:"Dados insuficientes"};
const row=(a,b)=>`<div class="r"><span>${a}</span><span>${b}</span></div>`;
const escHtml=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const logoMark=(ticker,nome)=>{const iniciais=String(ticker||nome||"AT").replace(/[^A-Z0-9]/gi,"").slice(0,3).toUpperCase()||"AT";return `<span class="asset-logo" aria-label="Identificador ${escHtml(ticker)}">${iniciais}</span>`};
const assetHead=(x,extra="")=>`<div class="asset-head">${logoMark(x.t,x.nome)}<div class="asset-meta"><div class="asset-line"><b>${escHtml(x.t)}</b>${extra}</div><small>${escHtml(x.nome||x.t)} · ${escHtml(x.setor||"Setor não informado")}</small></div></div>`;
function fut(t){const n=new Date();n.setHours(0,0,0,0);return DV(t).filter(d=>d.d&&new Date(d.d)>=n).map(d=>({t,v:d.v,d:new Date(d.d)}))}

let sec="top";
const cardR=(x,i)=>`<div class="cd"><div class="hd"><span class="rk">${i}</span><div style="min-width:0;flex:1">${assetHead(x,`<span class="pill ${x.s}">${TX[x.s]}</span>`)}</div></div>${row("Nota (0-100)",`<b>${x.sc}</b>`)}${row("Cotação",R(x.p))}${row("Preço teto",R(x.teto))}${row("Preço ideal",R(x.ideal))}${row("Mínima (52 semanas)",x.min!=null?R(x.min):"Não disponível na fonte")}${row("Margem de segurança",`<b class="${cls(x.margem)}">${P(x.margem)}</b>`)}${row("ROE · P/L · P/VP",`${P(x.u.roe)} · ${(x.u.pl||0).toFixed(1)} · ${(x.u.pvp||0).toFixed(2)}`)}</div>`;
const rank=()=>Object.keys(U).map(calc).filter(x=>x&&x.u.cat==="acao"&&isFinite(x.teto)).sort((a,b)=>b.sc-a.sc);
function fmtNumero(v,d=2){return v==null||!Number.isFinite(Number(v))?"—":Number(v).toLocaleString("pt-BR",{maximumFractionDigits:d})}
function catNome(c){return ({acao:"Ações",fii:"FIIs",etf:"ETFs",bdr:"BDRs",outro:"Outros"})[c]||"Outros"}
function drawTodos(){
 const lista=Object.values(U).filter(a=>{
   const c=tipoAtivo(a);if(todosCategoria!=="todos"&&c!==todosCategoria)return false;
   const q=todosBusca.trim().toLocaleLowerCase("pt-BR");
   return !q||String(a.t).toLowerCase().includes(q)||String(a.nome||"").toLowerCase().includes(q)||String(a.setor||"").toLowerCase().includes(q);
 });
 lista.sort((a,b)=>{let x,y;if(todosOrdenar==="nome"){x=a.nome||a.t;y=b.nome||b.t}else if(todosOrdenar==="preco"){x=Number(a.p)||-Infinity;y=Number(b.p)||-Infinity}else if(todosOrdenar==="dy"){x=Number(a.dy)||-Infinity;y=Number(b.dy)||-Infinity}else if(todosOrdenar==="setor"){x=a.setor||"";y=b.setor||""}else{x=a.t;y=b.t}return (x<y?-1:x>y?1:0)*todosOrdem});
 const porCat={acao:0,fii:0,etf:0,bdr:0,outro:0};Object.values(U).forEach(a=>{const c=tipoAtivo(a);porCat[porCat[c]===undefined?"outro":c]++});
 const porPagina=100,totalPag=Math.max(1,Math.ceil(lista.length/porPagina));todosPagina=Math.min(todosPagina,totalPag-1);const fatia=lista.slice(todosPagina*porPagina,(todosPagina+1)*porPagina);
 const rows=fatia.map(a=>{const cat=tipoAtivo(a),calcA=cat==="acao"?calc(a.t):null,status=a.p==null?"Sem cotação":(a.dados_fundamentos==="ok"?"Cotação + fundamentos":"Cotação; fundamentos limitados");return `<tr><td><b>${a.t}</b></td><td>${a.nome||"—"}</td><td>${catNome(cat)}</td><td>${a.setor||"—"}</td><td class="num">${R(a.p)}</td><td class="num">${P(a.dy)}</td><td class="num">${a.dpa!=null?R(a.dpa):"—"}</td><td class="num ${cls(a.desempenho_1a)}">${P(a.desempenho_1a)}</td><td class="num ${cls(a.desempenho_3a)}">${P(a.desempenho_3a)}</td><td>${calcA?(calcA.insuf?'<span class="pill a">Dados insuf.</span>':`<span class="pill ${calcA.s}">${TX[calcA.s]}</span>`):`<span class="pill a">${status}</span>`}</td></tr>`}).join("");
 const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
 $("#m").innerHTML=`<h2>Todos os ativos</h2><p class="n">Catálogo dos ativos presentes no arquivo publicado. Os números refletem a data de atualização da fonte; ausência de dados não significa desempenho negativo nem oportunidade de compra.</p>
 <div class="kp"><div><small>Total no catálogo</small><b>${Object.keys(U).length.toLocaleString("pt-BR")}</b></div><div><small>Ações</small><b>${porCat.acao}</b></div><div><small>FIIs</small><b>${porCat.fii}</b></div><div><small>ETFs</small><b>${porCat.etf}</b></div><div><small>BDRs</small><b>${porCat.bdr}</b></div></div>
 <div class="bar"><label>Categoria<select id="tc"><option value="todos">Todas as categorias</option><option value="acao">Ações</option><option value="fii">FIIs</option><option value="etf">ETFs</option><option value="bdr">BDRs</option><option value="outro">Outros</option></select></label><label style="flex:1;min-width:190px">Buscar ticker, empresa ou setor<input id="tb" value="${esc(todosBusca)}" placeholder="Ex.: PETR4, Itaú, tecnologia"></label><label>Ordenar por<select id="to"><option value="t">Ticker (A–Z)</option><option value="nome">Empresa (A–Z)</option><option value="setor">Setor</option><option value="preco">Preço</option><option value="dy">Dividend yield</option></select></label><button class="btn" id="tdir" style="background:#5b6275;color:white">${todosOrdem===1?"↑ Crescente":"↓ Decrescente"}</button></div>
 <div class="box" style="overflow-x:auto;padding:0"><table class="asset-table"><thead><tr><th>Ticker</th><th>Empresa / ativo</th><th>Categoria</th><th>Setor</th><th>Preço</th><th>DY</th><th>DPA médio</th><th>Desemp. 1 ano</th><th>Desemp. 3 anos</th><th>Estado dos dados</th></tr></thead><tbody>${rows||'<tr><td colspan="10">Nenhum ativo encontrado para esses filtros.</td></tr>'}</tbody></table></div>
 <div class="bar"><span class="n">Mostrando ${lista.length?todosPagina*porPagina+1:0}–${Math.min((todosPagina+1)*porPagina,lista.length)} de ${lista.length} resultados</span><button class="btn" id="tprev" ${todosPagina===0?"disabled":""} style="background:#5b6275;color:white">Anterior</button><span class="n">Página ${todosPagina+1} de ${totalPag}</span><button class="btn" id="tnext" ${todosPagina>=totalPag-1?"disabled":""} style="background:#5b6275;color:white">Próxima</button></div>`;
 $("#tc").value=todosCategoria;$("#to").value=todosOrdenar;
 $("#tc").onchange=e=>{todosCategoria=e.target.value;todosPagina=0;drawTodos()};
 $("#tb").oninput=e=>{todosBusca=e.target.value;todosPagina=0;drawTodosKeepFocus(e.target.selectionStart)};
 $("#to").onchange=e=>{todosOrdenar=e.target.value;todosPagina=0;drawTodos()};
 $("#tdir").onclick=()=>{todosOrdem*=-1;drawTodos()};$("#tprev").onclick=()=>{todosPagina=Math.max(0,todosPagina-1);drawTodos()};$("#tnext").onclick=()=>{todosPagina=Math.min(totalPag-1,todosPagina+1);drawTodos()};
}
function drawTodosKeepFocus(pos){drawTodos();const el=$("#tb");if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
function drawEmp(){const A=rank(),ss=[...new Set(A.map(x=>x.setor))].sort(),g=l=>`<div class="grid">${l.map((x,i)=>cardR(x,i+1)).join("")}</div>`;
 const body=!A.length?`<div class="cd">Nenhum dado ainda. Toque em Atualizar.</div>`:sec=="top"?g(A.slice(0,20)):sec=="all"?ss.map(s=>`<h3 style="margin-top:18px">${s}</h3>`+g(A.filter(x=>x.setor==s).slice(0,7))).join(""):g(A.filter(x=>x.setor==sec).slice(0,7));
 $("#m").innerHTML=`<h2>Ranking de empresas</h2><div class="bar"><select id="so"><option value="top">Top 20 geral</option><option value="all">7 melhores de cada setor</option>${ss.map(s=>`<option>${s}</option>`).join("")}</select></div><p class="n">Nota heurística (0–100), inspirada em princípios públicos associados a Barsi (dividendos, setores perenes) e Buffett/Graham (qualidade, dívida e margem de segurança); não reproduz modelos privados nem garante desempenho. Ativos sem DPA ou com histórico menor que o período configurado aparecem como dados insuficientes e não entram na carteira recomendada. Teto = menor entre Bazin (DPA médio ÷ ${S.dy}%) e Graham. Ideal = teto com ${S.desc}% de desconto.</p>${body}`;
 $("#so").value=sec;$("#so").onchange=e=>{sec=e.target.value;drawEmp()}}

function drawCart(){
  let inv=0,atu=0,div=0,ev=[];
  const cards=S.pos.map((q,i)=>{const x=calc(q.t),p=x?x.p:null,v=p?p*q.q:null,c=q.q*q.pm,g=v==null?null:v-c;
    inv+=c;if(v)atu+=v;if(x)div+=x.dpa*q.q;ev.push(...fut(q.t).map(e=>({...e,q:q.q})));
    let s="m",txt="Manter",motivo="Sem alerta quantitativo forte; revisar dados e fundamentos antes de decidir.";
    if(x){
      if(x.insuf){s="a";txt="Revisar dados";motivo="Dados fundamentais ou histórico de proventos insuficientes; não concluir compra/venda apenas com esta tela."}
      else if(x.p>x.teto){s="v";txt="Sinal: avaliar venda";motivo=`Cotação ${R(x.p)} acima do preço-teto estimado (${R(x.teto)}). Considere reavaliar valuation, tese e impostos; não é ordem automática.`}
      else if(S.lucro&&c>0&&g/c*100>=S.lucro){s="a";txt="Avaliar realização";motivo=`Ganho estimado de ${P(g/c*100)} supera sua meta configurada de ${P(S.lucro)}. Compare com a tese e custos antes de decidir.`}
      else if(x.p<=x.ideal){s="c";txt="Preço atrativo";motivo=`Cotação abaixo do preço-ideal calculado (${R(x.ideal)}); verifique qualidade, dados recentes e concentração da carteira.`}
    }else{motivo="Cotação/fundamentos não disponíveis. Não gerar sinal de venda sem dados confiáveis."}
    return`<div class="cd"><div class="hd"><span class="rk">${i+1}</span><div><b>${q.t}</b><span class="pill ${s}">${txt}</span><br><small>${x?x.nome:""}</small></div><span style="flex:1"></span><button class="btn" style="background:#5b6275;color:#fff;padding:4px 10px" data-d="${i}">Remover</button></div>
    ${row("Quantidade",q.q)}${row("Preço médio",R(q.pm))}${row("Cotação",R(p))}${row("Valor atual",R(v))}
    ${row("Ganho / perda",`<b class="${cls(g)}">${R(g)} ${g==null?"":`(${P(g/c*100)})`}</b>`)}
    ${row("Preço teto estimado",x?R(x.teto):"-")}${row("Preço ideal estimado",x?R(x.ideal):"-")}${row("Yield sobre custo",x?P(x.dpa/q.pm*100):"-")}
    <p class="n"><b>Por que apareceu este sinal?</b><br>${motivo}</p><button class="btn" data-sell="${i}" style="width:100%;background:linear-gradient(135deg,#ffb2a6,#ff858b);border-color:#ffc0b6;color:#40151b">Registrar venda…</button></div>`}).join("");
  ev.sort((a,b)=>a.d-b.d);const g=atu-inv;
  $("#m").innerHTML=`<h2>Minha carteira</h2>
  <div class="kp"><div><small>Investido</small><b>${R(inv)}</b></div><div><small>Valor atual</small><b>${R(atu)}</b></div><div><small>Ganho / perda</small><b class="${cls(g)}">${R(g)}</b><small>${inv?P(g/inv*100):""}</small></div><div><small>Dividendos estimados/ano</small><b>${R(div)}</b></div></div>
  <div class="box"><h3>Adicionar compra</h3><form id="f" class="bar" style="margin:0"><label>Ticker<input id="ft" placeholder="KLBN4" required style="width:110px"></label><label>Quantidade<input id="fq" type="number" min="1" required style="width:110px"></label><label>Preço médio pago (R$)<input id="fp" type="number" step="0.01" min="0" required style="width:150px"></label><button class="btn" style="align-self:end">Adicionar</button></form></div>
  <div class="box"><h3>Histórico de vendas registradas</h3>${(S.vendas||[]).slice().reverse().slice(0,8).map(v=>`<div class="ev"><span><b>${v.t}</b> · ${v.q} un. · ${v.data}</span><b>${R(v.preco*v.q)} <small>(${v.motivo||"venda manual"})</small></b></div>`).join("")||'<small>As vendas registradas aparecerão aqui. O botão apenas registra sua decisão; não envia ordem à corretora.</small>'}</div>
  <div class="box"><h3>Agenda de dividendos</h3>${ev.slice(0,6).map(e=>`<div class="ev"><span><b>${e.t}</b> · ${e.d.toLocaleDateString("pt-BR")}</span><b class="pos">+${R(e.v*e.q)}</b></div>`).join("")||`<small>Sem pagamentos futuros nos dados.</small>`}</div>
  <h3>Minhas empresas</h3><div class="grid">${cards||`<div class="cd">Adicione as ações que você comprou para acompanhar ganhos e saber a hora de vender.</div>`}</div>`;
  $("#f").onsubmit=async e=>{e.preventDefault();const t=$("#ft").value.trim().toUpperCase(),q=+$("#fq").value,pm=+$("#fp").value,ex=S.pos.find(a=>a.t==t);
    if(ex){ex.pm=(ex.pm*ex.q+pm*q)/(ex.q+q);ex.q+=q}else S.pos.push({t,q,pm});save();S.cache[t]?draw():await atualizar()};
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(confirm("Remover este ativo da lista sem registrar uma venda? Use ‘Registrar venda’ para lançar uma venda real.")){S.pos.splice(+b.dataset.d,1);save();draw()}});
  document.querySelectorAll("[data-sell]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.sell,q=S.pos[i];if(!q)return;
    const qt=Number(prompt(`Registrar venda de ${q.t}. Quantidade disponível: ${q.q}. Quantas unidades vendeu?`,String(q.q)));
    if(!Number.isFinite(qt)||qt<=0||qt>q.q){alert("Quantidade inválida. Nenhuma alteração foi feita.");return}
    const x=calc(q.t),sug=x&&x.p?x.p:0;
    const preco=Number(prompt("Preço por unidade recebido (R$):",sug?sug.toFixed(2):""));
    if(!Number.isFinite(preco)||preco<=0){alert("Preço inválido. Nenhuma alteração foi feita.");return}
    const motivo=prompt("Motivo (opcional): sinal do Radar, rebalanceamento, mudança de tese etc.",x&&x.p>x.teto?"Cotação acima do preço-teto estimado":"Decisão própria");
    const custo=q.pm*qt,receita=preco*qt;
    S.vendas=S.vendas||[];S.vendas.push({t:q.t,q:qt,preco,pm:q.pm,custo,receita,resultado:receita-custo,motivo:motivo||"Venda manual",data:new Date().toLocaleDateString("pt-BR")});
    q.q=Number((q.q-qt).toFixed(8));if(q.q<=0.00000001)S.pos.splice(i,1);save();draw();
  });
}

function drawRenda(){
  const now=new Date(),M=[];
  for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);M.push({k:d.getFullYear()*12+d.getMonth(),n:d.toLocaleDateString("pt-BR",{month:"short"}),v:0})}
  let ev=[];
  S.pos.forEach(q=>{DV(q.t).forEach(d=>{if(!d.d)return;const dt=new Date(d.d),m=M.find(m=>m.k==dt.getFullYear()*12+dt.getMonth());if(m&&dt<=now)m.v+=d.v*q.q});ev.push(...fut(q.t).map(e=>({...e,q:q.q})))});
  ev.sort((a,b)=>a.d-b.d);const mx=Math.max(1,...M.map(m=>m.v)),tot=M.reduce((a,m)=>a+m.v,0),nx=ev[0];
  $("#m").innerHTML=`<h2>Fluxo de renda</h2><div class="row"><div class="box" style="flex:2"><h3>Dividendos por mês (últimos 12 meses)</h3>
  <div class="chart">${M.map(m=>`<div>${m.v?R(m.v).replace("R$ ",""):""}<i style="height:${m.v/mx*80}%"></i>${m.n}</div>`).join("")}</div><p class="n">Calculado com a quantidade atual de cada ação da sua carteira.</p></div>
  <div><div class="box teal"><small>Próximos dividendos</small>${nx?`<h3 style="margin:6px 0 0">${nx.d.toLocaleDateString("pt-BR")} · ${nx.t}</h3><b style="font-size:20px">${R(nx.v*nx.q)}</b>`:`<p>Nenhum previsto nos dados.</p>`}</div>
  <div class="box"><h3>Renda dos últimos 12 meses</h3><div class="row" style="gap:6px"><div><small>Acumulado</small><br><b style="font-size:22px">${R(tot)}</b></div><div><small>Média mensal</small><br><b style="font-size:22px">${R(tot/12)}</b></div></div></div></div></div>`;
}

function pie(it){let a=0;const g=it.map((x,i)=>{const s=a;a+=x.w*100;return`${COL[i%COL.length]} ${s}% ${a}%`}).join(",");
  return`<div class="pie" style="background:conic-gradient(${g||"#555 0 100%"})"></div><div style="display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:center">${it.map((x,i)=>`<span class="lg"><i style="background:${COL[i%COL.length]}"></i>${x.t}: ${P(x.w*100)}</span>`).join("")}</div>`}
function drawRec(){const Rc=[],cnt={};for(const x of rank()){if(Rc.length>=10)break;if(x.insuf||x.p>x.teto||x.sc<50||(cnt[x.setor]||0)>=2)continue;cnt[x.setor]=(cnt[x.setor]||0)+1;Rc.push(x)}
 const FI=Object.values(U).filter(a=>tipoAtivo(a)==="fii"&&a.p!=null&&a.dy!=null&&a.dpa>0&&a.ap>=S.anos).map(a=>({a,score:Math.round(Math.min(Number(a.dy)||0,12)/12*35+Math.min(Number(a.ap)||0,5)/5*20+Math.max(0,Math.min(1,(Number(a.desempenho_3a)||0)/30))*15+(Number(a.pvp)>0&&Number(a.pvp)<=1?15:0)+(Number(a.liq)>0?15:0))})).sort((a,b)=>b.score-a.score).slice(0,10);
 const pos=S.pos.map(q=>{const x=calc(q.t);return x?{t:q.t,val:x.p*q.q,dym:x.dym}:null}).filter(Boolean),tv=pos.reduce((a,b)=>a+b.val,0),A=pos.map(p=>({t:p.t,w:p.val/tv})),dyA=pos.reduce((a,p)=>a+p.val/tv*p.dym,0);
 const B=Rc.map(x=>({t:x.t,w:1/Rc.length})),out=A.filter(a=>!Rc.find(r=>r.t==a.t)).map(a=>a.t),inn=Rc.filter(r=>!A.find(a=>a.t==r.t)).map(r=>r.t);
 $("#m").innerHTML=`<h2>Carteira atual x recomendada</h2><p class="n">Recomendada: até 10 empresas do ranking com nota ≥ 50, abaixo do preço teto, no máx. 2 por setor, pesos iguais.</p><div class="row"><div class="box"><h3>Carteira atual</h3>${tv?`<span class="dy">DY projetado: ${P(dyA)}</span>${pie(A)}`:`<p class="n">Adicione compras na aba Carteira.</p>`}</div><div class="box"><h3>Carteira recomendada</h3>${B.length?pie(B):`<p class="n">Nenhuma empresa passou nos critérios hoje.</p>`}</div></div>
 <div class="box"><h3>Empresas da recomendada</h3>${Rc.map((x,i)=>row(`${i+1}. ${x.t} · ${x.setor}`,`nota ${x.sc} · teto ${R(x.teto)}`)).join("")}</div>
 <div class="box"><h3>Ajustes sugeridos</h3><p>Entrar: ${inn.join(", ")||"nenhuma"}</p><p>Reavaliar ou reduzir: ${out.join(", ")||"nenhuma"}</p><p class="n">Os sinais são apoio à análise, não ordens. A decisão de comprar/vender é sempre sua. A cotação pode estar atrasada e fundamentos podem estar ausentes; confirme data e fonte antes de operar. Rentabilidade passada não garante resultados futuros.</p></div>
 <div class="box"><h3>FIIs que passaram pela triagem inicial</h3><p class="n">Pontuação preliminar por dividendos, histórico, P/VP, desempenho em 3 anos e liquidez quando disponível. É uma lista para investigação, não uma ordem de compra. Confirme qualidade dos rendimentos, vacância, concentração, dívida e relatórios gerenciais.</p>${FI.map((x,i)=>row(`${i+1}. ${x.a.t} · ${x.a.nome||""}`,`nota ${x.score}/100 · DY ${P(x.a.dy)} · P/VP ${fmtNumero(x.a.pvp)} · DPA ${R(x.a.dpa)} · 3 anos ${P(x.a.desempenho_3a)}`)).join("")||'<p class="n">Ainda não há FIIs com dados suficientes para essa triagem.</p>'}</div>
 <div class="box"><h3>ETFs e BDRs</h3><p class="n">São monitorados na aba Todos, com preço e desempenho quando disponíveis. Não recebem recomendação fundamentalista automática nesta versão: ETFs exigem comparação de índice, taxa e tracking difference; BDRs exigem fundamentos da empresa estrangeira, moeda e riscos específicos.</p></div>`}

function drawCfg(){
  $("#m").innerHTML=`<h2>Ajustes</h2><div class="box"><h3>Fonte de dados</h3><label>Endereço do dados.json (deixe como está se tudo estiver no mesmo site)<input id="c6" value="${S.url||DATA}"></label><br><label>Token brapi (opcional: cotação ao vivo só da carteira)<input id="c0" value="${S.token}"></label></div>
  <div class="box"><h3>Critérios de cálculo</h3><div class="bar"><label>DY alvo p/ preço teto (%)<input id="c1" type="number" step="0.5" value="${S.dy}"></label><label>Desconto p/ preço ideal (%)<input id="c2" type="number" value="${S.desc}"></label><label>Anos de histórico<input id="c3" type="number" min="1" max="10" value="${S.anos}"></label><label>Meta de lucro p/ vender (%)<input id="c4" type="number" value="${S.lucro}"></label></div></div>
  <div class="box"><h3>Ações monitoradas</h3><textarea id="c5" style="width:100%;min-height:90px">${S.watch.join(" ")}</textarea></div>
  <div class="bar"><button class="btn" id="sv">Salvar e atualizar</button><button class="btn" style="background:#5b6275;color:#fff" id="ex">Exportar backup</button><button class="btn" style="background:#5b6275;color:#fff" id="im">Importar backup</button></div>`;
  $("#sv").onclick=()=>{S.token=$("#c0").value.trim();S.url=$("#c6").value.trim();S.dy=+$("#c1").value||6;S.desc=+$("#c2").value||0;S.anos=+$("#c3").value||5;S.lucro=+$("#c4").value||0;
    S.watch=[...new Set($("#c5").value.toUpperCase().split(/[\s,;]+/).filter(Boolean))];save();atualizar()};
  $("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="radar-backup.json";a.click()};
  $("#im").onclick=()=>{const i=document.createElement("input");i.type="file";i.onchange=async()=>{try{S=JSON.parse(await i.files[0].text());save();draw()}catch(e){alert("Arquivo inválido")}};i.click()};
}
const V={todos:drawTodos,emp:drawEmp,cart:drawCart,renda:drawRenda,rec:drawRec,cfg:drawCfg};
function draw(){V[view]();
  document.querySelectorAll("[data-v]").forEach(a=>{const v=a.dataset.v,inv=["emp","cart","renda"].includes(view);
    a.classList.toggle("on",a.closest("#sub")?v==view:(v==view||(v=="emp"&&inv)))});
  $("#sub").classList.toggle("hide",!["emp","cart","renda"].includes(view))}
document.querySelectorAll("[data-v]").forEach(a=>a.onclick=()=>{view=a.dataset.v;draw();scrollTo(0,0)});
$("#upd").onclick=()=>atualizar(true);
draw();
if(navigator.onLine){atualizar(false)}else offline();
// Ao voltar a conexão, só tenta buscar se ainda não houver dados locais.
addEventListener("online",()=>{if(!S.uni)atualizar(false)});
</script></body></html>
